version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-baseimage-ubuntu_server_1
      APP_PORT: 80
  server:
    image: ghcr.io/linuxserver-playground/baseimage-ubuntu:resolute
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes: []
